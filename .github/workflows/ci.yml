# 持续集成
#
# 两条流水线（对应 docs/05-云端构建与验证方案.md）：
#   core-linux：Rust 核心的快速回路（本机也能跑，CI 只做兜底）
#   ios-macos ：在云端 macOS 上编译 iOS —— 这是"没有 Mac 也能验证 iOS"的唯一途径
#
# 设计原则：
# 1. **只依赖官方 action**（checkout / cache）。其余工具用 curl / git / cargo 自己装，
#    避免引入我无法验证的第三方 action 版本。
# 2. **Linux job 先跑**，用 needs 卡住昂贵的 macOS job（分钟数是真金白银）。
# 3. macOS job 第一步是**诊断**：把 Xcode 版本、可用模拟器打出来。
#    模拟器设备名会随 Xcode 版本变化，所以设备名靠动态发现而不是猜。
# 4. Linux job 通过 `just ci` 执行，与本地命令**完全一致**，避免两边漂移。

name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

# 同一分支只保留最新一次运行：新推送会取消排队中的旧 run。
# 这既能省 macOS 分钟数，也能把"卡在 queued 的僵尸 run"顺手清掉。
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  # ------------------------------------------------------------------
  # 快速回路：Rust 核心（约 1~3 分钟）
  # ------------------------------------------------------------------
  core-linux:
    name: Rust 核心（格式 / clippy / 测试 / iOS 交叉编译）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # rustup：core/rust-toolchain.toml 已声明 channel、组件与 3 个 iOS target，
      # 所以装好 rustup 之后工具链与 target 会自动补齐，无需在此重复声明。
      - name: 安装 rustup
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
            | sh -s -- -y --profile minimal --default-toolchain none
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: 缓存 cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            core/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('core/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      # 装 just 以复用 justfile：本地跑什么、CI 就跑什么。
      # 必须在 core/ 下跑：rustup 是用 --default-toolchain none 装的，
      # 工具链来自 core/rust-toolchain.toml；在仓库根目录没有它 → 无工具链可用。
      - name: 安装 just
        working-directory: core
        run: |
          if ! command -v just >/dev/null 2>&1; then
            cargo install just --locked
          fi
          just --version

      - name: 显示工具链与 target
        working-directory: core
        run: |
          rustc --version
          cargo --version
          rustup target list --installed

      # iOS 符号导出检查需要 llvm-nm（GNU nm 不认识 Mach-O 归档）。
      # 建一个稳定路径的符号链接，避免下游依赖 /usr/lib/llvm-*/bin 这种易变位置。
      - name: 确保 llvm-nm 可用
        run: |
          if ! command -v llvm-nm >/dev/null 2>&1; then
            found=$(ls -1 /usr/lib/llvm-*/bin/llvm-nm 2>/dev/null | tail -1 || true)
            if [ -z "$found" ]; then
              sudo apt-get update -qq
              sudo apt-get install -y llvm
              found=$(ls -1 /usr/lib/llvm-*/bin/llvm-nm 2>/dev/null | tail -1 || true)
            fi
            if [ -z "$found" ]; then
              echo "::error::安装后仍找不到 llvm-nm"
              exit 1
            fi
            sudo ln -sf "$found" /usr/local/bin/llvm-nm
          fi
          llvm-nm --version | head -1

      # 拆成独立步骤（而不是单个 `just ci`）：
      # 这样某一步失败时，**失败的步骤名本身就说明了是哪一环**，
      # 不需要登录看日志也能定位。命令与本地 justfile 完全一致。
      - name: 格式检查
        run: just fmt-check
      - name: clippy
        run: just lint
      - name: Rust 测试
        run: just test
      - name: iOS 交叉编译检查
        run: just check-ios
      - name: iOS 模拟器交叉编译检查
        run: just check-ios-sim
      - name: iOS 符号导出断言
        env:
          PERCH_REQUIRE_LLVM_NM: '1'
        run: just ios-symbols

  # ------------------------------------------------------------------
  # FFI 端到端：用 Dart 真的加载 .so 调用 Rust（约 2~3 分钟）
  #
  # 这是唯一能自动验证"Rust ↔ Dart 契约"的手段，且不需要任何设备或 Mac。
  # 与 core-linux 并行跑（都是免费的 Linux 分钟）。
  # ------------------------------------------------------------------
  ffi-smoke:
    name: FFI 端到端（Dart ↔ Rust C ABI）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 安装 rustup
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
            | sh -s -- -y --profile minimal --default-toolchain none
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      # 用 Dart 官方 tarball，不引入第三方 action
      - name: 安装 Dart SDK
        run: |
          curl -sSL -o /tmp/dart.zip \
            https://storage.googleapis.com/dart-archive/channels/stable/release/latest/sdk/dartsdk-linux-x64-release.zip
          unzip -q /tmp/dart.zip -d "$HOME"
          echo "$HOME/dart-sdk/bin" >> "$GITHUB_PATH"
          "$HOME/dart-sdk/bin/dart" --version

      - name: 编译核心动态库
        working-directory: core
        run: cargo build -p perch-ffi --release

      - name: 运行端到端冒烟
        working-directory: dart/perch_core
        run: |
          dart pub get
          dart run tool/ffi_smoke.dart ../../core/target/release/libperch_ffi.so

  # ------------------------------------------------------------------
  # 慢回路：云端 macOS 编译 iOS（约 10~20 分钟）
  # ------------------------------------------------------------------
  ios-macos:
    name: iOS 编译（macOS runner + Xcode）
    needs: core-linux
    # 标签必须用官方列表里的名字：macOS 26 的 arm64 镜像标签就是 `macos-26`
    # （或 `macos-latest` / `macos-26-xlarge`）。**没有** `macos-26-arm64` 这个标签——
    # 写成本来不存在的标签，job 会永远 queued 而不会报错，非常难察觉。
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      # 诊断先跑：设备名随 Xcode 版本变化，靠这里打印出来而不是靠猜。
      - name: 诊断环境
        run: |
          echo "===== Xcode ====="
          xcodebuild -version
          echo "===== 可用 SDK ====="
          xcodebuild -showsdks | grep -i ios || true
          echo "===== 可用模拟器（前 40 行）====="
          xcrun simctl list devices available | head -40
          echo "===== CocoaPods ====="
          pod --version || echo "未安装 CocoaPods"

      # Rust 工具链：flutter build 期间，podspec 的 script_phase 会调用 cargo。
      # core/rust-toolchain.toml 已声明 3 个 iOS target，rustup 会自动补齐。
      - name: 安装 rustup（供 podspec 的构建阶段调用 cargo）
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
            | sh -s -- -y --profile minimal --default-toolchain none
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: 安装 Flutter
        run: |
          # 用 git 拉 stable 分支，避免依赖第三方 action
          if [ ! -d "$HOME/flutter" ]; then
            git clone --depth 1 --branch stable https://github.com/flutter/flutter.git "$HOME/flutter"
          fi
          echo "$HOME/flutter/bin" >> "$GITHUB_PATH"
          "$HOME/flutter/bin/flutter" --version

      - name: 缓存 Flutter 与 pub
        uses: actions/cache@v4
        with:
          path: |
            ~/.pub-cache
            ~/flutter/bin/cache
          key: ${{ runner.os }}-flutter-${{ hashFiles('app/pubspec.lock') }}
          restore-keys: ${{ runner.os }}-flutter-

      - name: 安装依赖
        working-directory: app
        run: |
          flutter pub get

      # Dart 静态分析：不需要设备，先把明显的编译错误挡掉。
      # 用 `dart analyze` 而不是 `flutter analyze`：后者在本项目的中文路径下会崩
      # （见 docs/03 的"环境怪癖"），而 dart analyze 正常，两者检查内容一致。
      - name: Dart 静态分析
        working-directory: app
        run: dart analyze

      # 产品逻辑单测：纯 Dart VM，不需要设备。覆盖进度存储与恢复的完整往返
      - name: Flutter 单元测试
        working-directory: app
        run: flutter test

      # 关键的编译验证：模拟器构建**不需要签名**，因此 CI 里可以跑
      # 这条通过就说明：Flutter + flutter_readium（含其 Swift/Kotlin 原生部分）能编进 iOS App
      - name: 编译 iOS（模拟器）
        working-directory: app
        run: |
          # 必须开 pipefail：Actions 默认 shell 是 `bash -e` 而**不含 pipefail**，
          # 否则 `| tail` 会让本步骤的退出码变成 tail 的 0，
          # 构建失败也会显示通过——那比没有 CI 更糟。
          set -o pipefail
          # 模拟器构建不涉及签名，因此 CI 里可跑
          flutter build ios --simulator 2>&1 | tail -200

      # 关键断言：`-force_load` 是否真的把 Rust 符号链进了最终二进制。
      # 编译通过 ≠ 符号在里面 —— 没有 -force_load 时链接器会把没人引用的
      # 静态库内容当死代码丢掉，而 App 依然"编译成功"，直到运行时
      # DynamicLibrary.process() 才报符号找不到。
      - name: 断言 Rust 符号已链入 App 二进制
        run: |
          set -o pipefail
          binary=$(find app/build/ios/iphonesimulator -maxdepth 2 -name Runner -type f | head -1)
          if [ -z "$binary" ]; then
            echo "::error::找不到 Runner 可执行文件"
            exit 1
          fi
          echo "检查：$binary"
          ls -la "$binary"

          # 先取整张符号表再比较（不要 nm | grep -q：见 docs/03 §九）
          symbols=$(nm "$binary" 2>/dev/null || true)
          echo "--- 符号表里所有 perch 相关条目（自诊断用）---"
          grep -i perch <<<"$symbols" || echo "（一条都没有）"
          echo "--- 符号总数 ---"
          wc -l <<<"$symbols"

          for symbol in _perch_call _perch_string_free; do
            if ! grep -qE "^[0-9a-f]+ [Tt] $symbol$" <<<"$symbols"; then
              echo "::error::$symbol 不在 App 二进制里 —— 静态库没有被链入"
              exit 1
            fi
            echo "✓ $symbol 已链入 App"
          done

      - name: 汇总
        if: always()
        run: |
          echo "iOS 编译产物："
          ls -la app/build/ios/iphonesimulator/ 2>/dev/null || echo "（无产物）"
